version: '3.8'

services:
  # Backend service (renamed from 'web' to 'backend')
  backend:
    build: ./softwarearch-sistema-matricula-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    container_name: matricula_backend
    restart: unless-stopped

  # Database service
  db:
    image: postgres:13
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      - app-network
    container_name: matricula_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d matricula"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend service
  frontend:
    build:
      context: ./softwarearch-sistema-matricula-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./softwarearch-sistema-matricula-frontend:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - app-network
    container_name: matricula_frontend
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
